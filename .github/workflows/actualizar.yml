# Automatic headlines, three times a day, with no AI: scripts/actualizar.js reads the feeds in scripts/fuentes.json,
# writes the new GTA VI headlines in data/titulares.json and the result is published straight to main.
name: Recoger titulares

on:
  schedule:
    # 08:30, 17:30 and 23:30 in Spain all year. Spain is UTC+2 in summer and UTC+1 in winter, so each time is
    # scheduled at both UTC hours and the "previo" job lets through only the cron that matches Madrid's offset
    # that day. It looks at the cron, not at the clock, because GitHub can start scheduled runs hours late.
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

# Never two runs at once: the second waits instead of racing on the same file.
concurrency:
  group: recoger-titulares
  cancel-in-progress: false

jobs:
  previo:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - name: Comprobar que el cron es el de hoy en España
        id: comprobar
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "toca=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          hora_utc=$(echo "$CRON" | awk '{print $2}')
          desfase=$(TZ=Europe/Madrid date +%z | cut -c2-3)
          hora=$(( (10#$hora_utc + 10#$desfase) % 24 ))
          case "$hora" in 8|17|23) toca=si ;; *) toca=no ;; esac
          echo "Cron «$CRON»: en España corresponde a las $hora:30 → toca=$toca"
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

  recoger:
    needs: previo
    if: needs.previo.outputs.toca == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recoger titulares
        run: node scripts/actualizar.js

      - name: Validar datos y titulares
        run: node scripts/validar-datos.js

      - name: Publicar si hay titulares nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/titulares.json
          if git diff --cached --quiet; then
            echo "Sin titulares nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: titulares automáticos $(TZ=Europe/Madrid date '+%F %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with the workflow token does not trigger GitHub Pages: ask for the rebuild explicitly.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent && echo "Web en reconstrucción."
