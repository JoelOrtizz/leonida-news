# Daily collection of GTA VI headlines into data/pendientes.json (no AI). See scripts/actualizar.js.
name: Recoger novedades

on:
  schedule:
    # 23:00 in Spain all year: 21:00 UTC in summer (CEST) and 22:00 UTC in winter (CET). Both are scheduled and
    # the "hora" job lets through only the one that falls at 23:00 in Madrid. GitHub may start them a few minutes late.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never two runs at once: the second waits instead of racing on the same file.
concurrency:
  group: recoger-novedades
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - name: Comprobar que son las 23:00 en España
        id: comprobar
        run: |
          hora=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hora" != "23" ]; then
            echo "En España son las $hora:xx: esta ejecución programada no toca."
            echo "toca=no" >> "$GITHUB_OUTPUT"
          else
            echo "toca=si" >> "$GITHUB_OUTPUT"
          fi

  recoger:
    needs: hora
    if: needs.hora.outputs.toca == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recoger titulares
        run: node scripts/actualizar.js

      - name: Validar datos y cola
        run: node scripts/validar-datos.js

      - name: Guardar la cola si ha cambiado
        run: |
          git add data/pendientes.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: revisión automática $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
