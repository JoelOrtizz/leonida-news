# Daily collection of GTA VI headlines into data/pendientes.json (no AI). See scripts/actualizar.js.
name: Recoger novedades

on:
  schedule:
    # 22:00 UTC = 23:00 in Spain in winter (CET, from 25 Oct 2026). GitHub may start scheduled runs a few minutes late.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never two runs at once: the second waits instead of racing on the same file.
concurrency:
  group: recoger-novedades
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recoger titulares
        run: node scripts/actualizar.js

      - name: Validar datos y cola
        run: node scripts/validar-datos.js

      - name: Guardar la cola si ha cambiado
        run: |
          git add data/pendientes.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: revisión automática $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
